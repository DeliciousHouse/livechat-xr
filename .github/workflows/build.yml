name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  relay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Discovery dependencies
        run: pip install -r server/requirements.txt
      - name: Synthetic capture source guards (mocked launch boundaries only)
        run: python -B -m unittest discover -s tests -p test_qa_capture.py -v
      - name: Linux deployment guards and loopback probe
        run: python -m unittest discover -s tests -p test_deploy.py -v
      - name: Linux discovery and hosted chat isolation
        run: python -m unittest tests.test_network tests.test_network_operations tests.test_network_surfaces tests.test_network_backup tests.test_discord_delivery -v

  build:
    name: windows-build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Build OpenXR layer
        shell: cmd
        run: layer\build.cmd

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          # No pip cache: this job builds the released installer, and a cache is a write path into it.

      - name: Install dependencies
        run: pip install -r app/requirements.txt -r server/requirements.txt pyinstaller==6.22.3

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Package app
        run: pyinstaller --noconfirm --clean LiveChatXR.spec

      - name: Smoke-test packaged app
        shell: pwsh
        run: |
          $p = Start-Process dist\LiveChatXR\LiveChatXR.exe -ArgumentList '--check' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "packaged app failed --check ($($p.ExitCode))" }

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: LiveChatXR-Portable
          path: dist/LiveChatXR/

      - name: Build installer
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') { throw 'Invalid version tag' }
          $v = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME.Substring(1) } else { "0.0.0-dev.${{ github.run_number }}" }
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version 6.7.1 --no-progress -y | Out-Null
            if ($LASTEXITCODE) { throw 'Inno Setup install failed' }
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$v installer\livechat-xr.iss
          if ($LASTEXITCODE) { throw "ISCC failed" }
          $files = @(Get-ChildItem dist/LiveChatXR-Setup-*.exe)
          if ($files.Count -ne 1 -or $files[0].Length -eq 0) { throw 'Expected one nonempty installer' }
          $hash = (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($files[0].Name)" | Set-Content dist/SHA256SUMS -Encoding ascii

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: LiveChatXR-Setup
          path: |
            dist/LiveChatXR-Setup-*.exe
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  full-suite:
    if: always()
    needs: [build, relay-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test and packaging lane
        env:
          WINDOWS: ${{ needs.build.result }}
          RELAY: ${{ needs.relay-tests.result }}
        run: test "$WINDOWS" = success && test "$RELAY" = success

  release:
    if: github.ref_type == 'tag'
    needs: [build, full-suite]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: LiveChatXR-Setup
          path: dist
      - name: Verify installer checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/LiveChatXR-Setup-*.exe
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') || contains(github.ref_name, '+') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || contains(github.ref_name, '+') && 'false' || 'true' }}
